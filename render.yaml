services:
  - type: web
    name: face-login
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py serve
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: PROXY_SECRET
        sync: false
      - key: TEMPLATE_KEY
        sync: false
      - key: SETUP_KEY
        sync: false
