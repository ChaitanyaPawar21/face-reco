<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in</title>
<link rel="stylesheet" href="/style.css">
<script src="/camera.js" defer></script>
</head>
<body data-page="login">
<header hidden>
  <a href="/">Home</a>
  <a href="/admin" id="admin-link" hidden>Admin</a>
  <span class="grow"></span>
  <span id="who"></span>
  <button id="logout">Log out</button>
</header>
<main hidden>
<h1>Log in</h1>
<p id="empty" hidden>Nobody is registered yet. Open the setup link first.</p>
<form id="login" class="stack">
  <label>Username <input name="name" required maxlength="50" autocomplete="username"></label>
  <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
  <button class="primary">Continue</button>
</form>
<div class="camera" hidden>
  <video autoplay playsinline muted aria-label="Camera preview"></video>
  <p class="prompt" role="status" aria-live="assertive"></p>
</div>
</main>
<p id="notice" role="status" aria-live="polite"></p>
</body>
</html>
